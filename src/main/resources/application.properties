server.port=8080
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:${AUTH_DB_URL:jdbc:mysql://localhost:3306/fashion_marketplace?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&serverCharset=utf8mb4&characterEncoding=UTF-8&useUnicode=true}}
spring.datasource.username=${DB_USERNAME:${AUTH_DB_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${AUTH_DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true

spring.mail.host=${AUTH_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${AUTH_MAIL_PORT:587}
spring.mail.username=${AUTH_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${AUTH_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.jwt.secret=${JWT_SECRET:change-me-to-a-very-long-secret-key-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.otp.ttl-minutes=${OTP_TTL_MINUTES:10}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${FACEBOOK_REDIRECT_URI:http://localhost:8080/login/oauth2/code/facebook}
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture{url}
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# GHN (Giao Hàng Nhanh)
app.ghn.api-url=${GHN_API_URL:https://dev-online-gateway.ghn.vn/shiip/public-api/v2/}
app.ghn.api-token=${GHN_API_TOKEN:}

# Image Search (Python AI microservice)
app.image-search.url=${IMAGE_SEARCH_URL:http://localhost:8000}
app.image-search.connect-timeout-ms=${IMAGE_SEARCH_CONNECT_TIMEOUT_MS:3000}
app.image-search.read-timeout-ms=${IMAGE_SEARCH_READ_TIMEOUT_MS:15000}

# Allow larger multipart uploads for image search
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# VNPay
app.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}

app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/payment/result}
app.vnpay.version=2.1.0
app.vnpay.command=pay
app.vnpay.order-type=other
